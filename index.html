<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task-2: To-Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true">
          <path d="M12 2L2 7v9c0 5 10 6 10 6s10-1 10-6V7L12 2z"/>
        </svg>
        <h1>Task-2</h1>
      </div>
      <p class="subtitle">
        A simple, polished to-do list — add, complete, delete. 
        <span id="task-count">0</span> items
      </p>
    </header>

    <section class="composer">
      <label for="new-task" class="visually-hidden">Add new task</label>
      <input id="new-task" class="input" placeholder="Add a new task and press Enter" autocomplete="off">
      <button id="add-btn" class="btn">Add</button>
    </section>

    <section class="controls">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="btn ghost">Clear completed</button>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="app-footer">
      Built with ❤️ • Vanilla JavaScript • LocalStorage
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
